<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Infinita 3D</title>
  <meta name="description"
    content="Galería interactiva infinita estilo moodboard con autocentrado magnético y fondo crema">
  <style>
    :root {
      --perspective: 1100px;
      --card-radius: 12px;
      --bg-cream: #fefae0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-cream);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      position: relative;
      cursor: default;
    }

    /* Fondo claro crema con cuadrícula técnica sutil estilo moodboard / lienzo */
    .canvas-bg {
      position: fixed;
      inset: 0;
      background-color: var(--bg-cream);
      background-image:
        linear-gradient(rgba(140, 120, 80, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 120, 80, 0.08) 1px, transparent 1px);
      background-size: 36px 36px;
      z-index: 0;
      pointer-events: none;
    }

    /* Halo ambiental cálido y suave en el fondo */
    .ambient-warmth {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 1100px;
      height: 1100px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(254, 250, 224, 0.2) 60%, transparent 80%);
      z-index: 1;
      pointer-events: none;
    }

    /* Viewport de perspectiva 3D */
    #galaxy-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: var(--perspective);
      perspective-origin: 50% 50%;
      z-index: 2;
    }

    /* Tarjeta individual (100% vertical, sin inclinación ni rotación Z) */
    .card-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: center center;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--card-radius);
      transition: transform 0.18s ease-out, box-shadow 0.22s ease-out;
      transform-style: preserve-3d;
    }

    /* En fondo claro las tarjetas usan sombra en hover, el brillo queda reservado para el lightbox oscuro */
    .card-glow {
      display: none;
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      background: #ffffff;
      border: 1px solid rgba(80, 60, 30, 0.12);
      box-shadow: 0 10px 26px rgba(50, 38, 16, 0.08), 0 2px 6px rgba(50, 38, 16, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, filter 0.16s ease-out;
      will-change: filter;
    }

    .card:hover {
      border-color: rgba(60, 45, 20, 0.38);
      box-shadow: 0 30px 65px rgba(45, 32, 12, 0.25), 0 10px 24px rgba(45, 32, 12, 0.12);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Viñeta perimetral de DESENFOQUE PURO (fondo claro, CERO oscuridad) */
    #fisheye-vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      backdrop-filter: blur(14px);
      -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.45) 65%, black 90%);
      mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.45) 65%, black 90%);
    }

    /* Estado Vacío sobre fondo claro */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #383424;
      text-align: center;
      padding: 44px 56px;
      border: 2px dashed rgba(80, 60, 30, 0.30);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 14px 40px rgba(70, 50, 20, 0.08);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .empty-state:hover {
      border-color: rgba(80, 60, 30, 0.60);
      color: #1a170d;
      transform: translate(-50%, -52%);
      box-shadow: 0 20px 50px rgba(70, 50, 20, 0.16);
      background: rgba(255, 255, 255, 0.95);
    }

    .empty-state svg {
      width: 52px;
      height: 52px;
      fill: currentColor;
      margin-bottom: 16px;
      opacity: 0.85;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 0.88rem;
      opacity: 0.70;
    }

    /* Lightbox Modal: Fondo oscuro/negro cinematográfico con brillo trasero radiante */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 8, 12, 0.90);
      backdrop-filter: blur(24px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      perspective: 1500px;
      cursor: zoom-out;
    }

    .lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content-wrapper {
      transform: scale(0.4) translateY(60px);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      position: relative;
    }

    .lightbox-overlay.active .lightbox-content-wrapper {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .lightbox-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: blur(75px) saturate(2.6) brightness(1.35);
      z-index: 0;
      opacity: 0.90;
      pointer-events: none;
      transform: translate3d(0, 0, -25px);
    }

    .lightbox-img {
      max-width: 86vw;
      max-height: 84vh;
      border-radius: 14px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.65);
      object-fit: contain;
      position: relative;
      z-index: 1;
      transform: translate3d(0, 0, 0);
      transition: transform 0.12s ease-out;
    }

    #file-input {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Input de archivos oculto -->
  <input type="file" id="file-input" accept="image/*" multiple>

  <!-- Fondo claro crema con sutil textura de lienzo -->
  <div class="canvas-bg"></div>

  <!-- Halo de calidez en el centro -->
  <div class="ambient-warmth"></div>

  <!-- Viewport 3D -->
  <div id="galaxy-viewport"></div>

  <!-- Viñeta Ojo de Pez de desenfoque perimetral óptico (sin negro) -->
  <div id="fisheye-vignette"></div>

  <!-- Estado Inicial Vacío -->
  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 24 24">
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
    </svg>
    <h2>Haz doble clic en la pantalla</h2>
    <p>para cargar tus imágenes y explorar el lienzo infinito</p>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox">
    <div class="lightbox-content-wrapper" id="lightbox-wrapper">
      <img class="lightbox-glow" id="lightbox-glow" src="" alt="">
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>
  </div>

  <script>
    // ── Referencias DOM ──
    const fileInput = document.getElementById('file-input');
    const emptyState = document.getElementById('empty-state');
    const viewport = document.getElementById('galaxy-viewport');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxGlow = document.getElementById('lightbox-glow');

    // ── Catálogo de imágenes cargadas ──
    let userImages = [];
    let rafId = null;
    let isCtrlPressed = false;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let lightboxActive = false;

    // ── Dimensiones Dinámicas y Separación Amplia (Margen Parejo 64px) ──
    const BASE_COL_W = 210;
    const MARGIN = 64; // Separación exacta de 64px arriba, abajo, izquierda y derecha
    const STD_SCALE = 0.92;
    const HERO_SCALE = 1.28;
    const STD_W = BASE_COL_W * STD_SCALE; // ~193.2px (mitad: 96.6px)
    const HERO_W = BASE_COL_W * HERO_SCALE; // ~268.8px (mitad: 134.4px)

    // Paso horizontal uniforme entre columnas: (HERO_W/2) + MARGIN + (STD_W/2) = 295px
    // Garantiza que cualquier tarjeta que esté en el centro tenga exactamente ~64-65px de margen lateral
    const STEP_X = Math.round((HERO_W / 2) + MARGIN + (STD_W / 2)); // 295px

    function getColumnX(c) {
      return c * STEP_X;
    }

    // Desfasaje vertical asimétrico por columna (Miro / FigJam / Pinterest)
    // CERO filas horizontales: cada columna corre a una altura vertical completamente distinta
    function getColumnOffset(c) {
      if (c === 0) return 0; // Columna central con hero en Y = 0
      const pattern = [0, -125, 95, -85, 120, -100, 75];
      const idx = ((Math.abs(c) % pattern.length) + pattern.length) % pattern.length;
      return pattern[idx] * (c < 0 ? -1 : 1);
    }

    // Altura natural según el formato de la imagen (horizontal, cuadrada o vertical)
    function getCardNaturalHeight(imgIdx) {
      if (imgIdx < 0 || !userImages[imgIdx]) return 295;
      const img = userImages[imgIdx];
      const ratio = (img.w && img.h) ? (img.w / img.h) : 0.71;
      // Horizontal (ratio > 1.2) -> altura reducida (~150-180px)
      // Cuadrada (0.85-1.2) -> altura cuadrada (~210px)
      // Vertical (ratio < 0.85) -> altura póster (~295-310px)
      return Math.round(Math.max(150, Math.min(310, BASE_COL_W / ratio)));
    }

    // Paso vertical entre tarjetas consecutivas de la columna c entre r y r+1
    // Considera la escala para que el margen libre entre bordes sea SIEMPRE de 64px
    function getVerticalStep(c, r, count) {
      const idxCurr = getMoodboardImageIndex(c, r, count);
      const idxNext = getMoodboardImageIndex(c, r + 1, count);
      const hCurr = getCardNaturalHeight(idxCurr);
      const hNext = getCardNaturalHeight(idxNext);
      const halfVisualCurr = (hCurr * HERO_SCALE) / 2;
      const halfVisualNext = (hNext * STD_SCALE) / 2;
      return Math.round(halfVisualCurr + MARGIN + halfVisualNext);
    }

    // Posición del centro (worldX, worldY) de cada tarjeta
    // Garantiza que entre tarjeta y tarjeta haya EXACTAMENTE un margen de 64px en vertical y horizontal
    function getCardWorldPos(c, r, count) {
      const worldX = getColumnX(c);
      const colOff = getColumnOffset(c);
      let worldY = colOff;

      if (r > 0) {
        for (let i = 0; i < r; i++) {
          worldY += getVerticalStep(c, i, count);
        }
      } else if (r < 0) {
        for (let i = 0; i > r; i--) {
          worldY -= getVerticalStep(c, i - 1, count);
        }
      }

      return { worldX, worldY };
    }

    // Cámara con posición, inercia y autocentrado magnético
    const camera = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      vx: 0,
      vy: 0
    };

    // Parámetros de velocidad y suavizado
    const BASE_SPEED = 26;
    const ACCEL_POWER = 1.9;
    const INERTIA_FRICTION = 0.91;
    const LERP_SMOOTH = 0.085;
    const AUTO_SNAP_SPEED = 0.065; // Suavidad para acomodarse lentamente en el centro

    // Efecto Ojo de Pez
    const MAX_SINK_Z = 360;
    const MAX_TILT = 15;

    // Piscina de tarjetas DOM para alto rendimiento (60-120fps)
    const cardPool = [];
    const MAX_POOL_SIZE = 75;

    function initCardPool() {
      for (let k = 0; k < MAX_POOL_SIZE; k++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.style.display = 'none';

        const glow = document.createElement('div');
        glow.className = 'card-glow';

        const inner = document.createElement('div');
        inner.className = 'card-inner';

        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.className = 'card-img';
        img.draggable = false;

        card.appendChild(img);
        inner.appendChild(glow);
        inner.appendChild(card);
        wrapper.appendChild(inner);
        viewport.appendChild(wrapper);

        const cardItem = {
          wrapper,
          inner,
          card,
          glow,
          img,
          imageIndex: -1,
          hovered: false,
          hoverRotX: 0,
          hoverRotY: 0,
          worldX: 0,
          worldY: 0
        };

        // Hover 3D + glow reactivo
        wrapper.addEventListener('mousemove', (e) => {
          if (isCtrlPressed || lightboxActive || isDragging) return;
          const rect = wrapper.getBoundingClientRect();
          const normX = (e.clientX - rect.left) / rect.width;
          const normY = (e.clientY - rect.top) / rect.height;

          cardItem.hoverRotX = (normY - 0.5) * 16;
          cardItem.hoverRotY = -(normX - 0.5) * 16;
          cardItem.hovered = true;

          // Al hacer hover, se asegura máxima nitidez
          card.style.filter = 'none';

          // Elevación 3D y sombra profunda en hover sobre el fondo claro crema (sin brillo luminoso)
          inner.style.transform = `translateZ(45px) scale(1.05) rotateX(${cardItem.hoverRotX}deg) rotateY(${cardItem.hoverRotY}deg)`;
          card.style.boxShadow = '0 32px 70px rgba(45, 32, 12, 0.26), 0 10px 24px rgba(45, 32, 12, 0.12)';
          card.style.borderColor = 'rgba(60, 45, 20, 0.38)';
        });

        wrapper.addEventListener('mouseleave', () => {
          cardItem.hovered = false;
          cardItem.hoverRotX = 0;
          cardItem.hoverRotY = 0;
          inner.style.transform = 'translateZ(0px) scale(1) rotateX(0deg) rotateY(0deg)';
          card.style.boxShadow = '';
          card.style.borderColor = '';
        });

        wrapper.addEventListener('click', (e) => {
          e.stopPropagation();
          if (cardItem.imageIndex >= 0 && userImages[cardItem.imageIndex]) {
            openLightbox(userImages[cardItem.imageIndex]);
          }
        });

        cardPool.push(cardItem);
      }
    }

    initCardPool();

    // ── Mapeo armónico de imágenes en el moodboard ──
    // Asegura que (0,0) es siempre imagen 0, y que las vecinas nunca repiten imagen
    function getMoodboardImageIndex(c, r, count) {
      if (count <= 1) return 0;
      if (c === 0 && r === 0) return 0; // Imagen central principal

      const k = (count % 2 === 0) ? (count - 1) : 3;
      let val = c * 2 + r * k;
      return ((val % count) + count) % count;
    }

    // ── Optimización de imágenes en cliente con Canvas ──
    function optimizeImage(file) {
      return new Promise((resolve, reject) => {
        const fullSrc = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const MAX_SIZE = 800;
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (w > MAX_SIZE || h > MAX_SIZE) {
            const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          let thumb;
          try {
            thumb = canvas.toDataURL('image/webp', 0.85);
          } catch {
            thumb = canvas.toDataURL('image/jpeg', 0.85);
          }

          resolve({
            thumb,
            fullSrc,
            w: img.naturalWidth,
            h: img.naturalHeight
          });
        };
        img.onerror = reject;
        img.src = fullSrc;
      });
    }

    // ── Control de Navegación (Ctrl + Cursor & Mouse Drag & Wheel) ──
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Control') {
        isCtrlPressed = true;
        document.body.style.cursor = 'crosshair';
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Control') {
        isCtrlPressed = false;
        document.body.style.cursor = 'default';

        // Inercia de salida
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const ndx = (mouseX - cx) / cx;
        const ndy = (mouseY - cy) / cy;
        const dist = Math.hypot(ndx, ndy);
        const speed = BASE_SPEED * Math.pow(dist, ACCEL_POWER);

        camera.vx = ndx * speed * 0.40;
        camera.vy = ndy * speed * 0.40;
      }
    });

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      if (isDragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        dragStartX = e.clientX;
        dragStartY = e.clientY;

        camera.targetX -= dx * 1.2;
        camera.targetY -= dy * 1.2;
        camera.vx = -dx * 0.4;
        camera.vy = -dy * 0.4;
      }
    });

    // Paneo con arrastre de ratón (opcional además de Ctrl)
    window.addEventListener('mousedown', (e) => {
      if (lightboxActive || e.target.closest('.card-wrapper')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      document.body.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = isCtrlPressed ? 'crosshair' : 'default';
      }
    });

    // Soporte para rueda de ratón / touchpad
    window.addEventListener('wheel', (e) => {
      if (lightboxActive) return;
      camera.targetX += e.deltaX * 0.75;
      camera.targetY += e.deltaY * 0.75;
      camera.vx = e.deltaX * 0.35;
      camera.vy = e.deltaY * 0.35;
    }, { passive: true });

    // ── Actualización de Cámara con Autocentrado Magnético ──
    function updateCamera() {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      if (isCtrlPressed) {
        const ndx = (mouseX - cx) / cx;
        const ndy = (mouseY - cy) / cy;
        const dist = Math.min(Math.hypot(ndx, ndy), 1.5);

        const speed = BASE_SPEED * (1 + Math.pow(dist, ACCEL_POWER) * 2.0);

        camera.targetX += ndx * speed;
        camera.targetY += ndy * speed;
        camera.vx = ndx * speed;
        camera.vy = ndy * speed;
      } else if (!isDragging) {
        // Desaceleración por inercia
        camera.vx *= INERTIA_FRICTION;
        camera.vy *= INERTIA_FRICTION;
        if (Math.abs(camera.vx) < 0.05) camera.vx = 0;
        if (Math.abs(camera.vy) < 0.05) camera.vy = 0;

        camera.targetX += camera.vx;
        camera.targetY += camera.vy;

        // ── AUTOCENTRADO MAGNÉTICO (Acomodar lentamente en el centro) ──
        // Si no se está navegando activamente y la velocidad es baja,
        // la galería se desliza suavemente para fijar la imagen más cercana en el centro exacto.
        if (userImages.length > 0 && Math.hypot(camera.vx, camera.vy) < 1.8) {
          snapToNearestCard();
        }
      }

      camera.x += (camera.targetX - camera.x) * LERP_SMOOTH;
      camera.y += (camera.targetY - camera.y) * LERP_SMOOTH;
    }

    // Calcula la tarjeta más cercana a la vista y la toma como objetivo central
    function snapToNearestCard() {
      const approxC = Math.round(camera.targetX / STEP_X);
      let bestX = 0;
      let bestY = 0;
      let minDistance = Infinity;

      for (let dc = -1; dc <= 1; dc++) {
        const c = approxC + dc;
        for (let r = -2; r <= 2; r++) {
          const pos = getCardWorldPos(c, r, userImages.length);
          const dist = Math.hypot(camera.x - pos.worldX, camera.y - pos.worldY);
          if (dist < minDistance) {
            minDistance = dist;
            bestX = pos.worldX;
            bestY = pos.worldY;
          }
        }
      }

      camera.targetX += (bestX - camera.targetX) * AUTO_SNAP_SPEED;
      camera.targetY += (bestY - camera.targetY) * AUTO_SNAP_SPEED;
    }

    // ── Renderizado Infinito Masonry Asimétrico + Centro Ampliado ──
    function renderInfiniteGallery() {
      if (userImages.length === 0) return;

      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const cx = winW / 2;
      const cy = winH / 2;
      const maxScreenDist = Math.hypot(cx, cy);

      const buffer = 600;
      const minCol = Math.floor((camera.x - cx - buffer) / STEP_X) - 1;
      const maxCol = Math.ceil((camera.x + cx + buffer) / STEP_X) + 1;

      let poolIndex = 0;

      for (let c = minCol; c <= maxCol; c++) {
        const minRow = Math.floor((camera.y - cy - buffer) / 380) - 1;
        const maxRow = Math.ceil((camera.y + cy + buffer) / 380) + 1;

        for (let r = minRow; r <= maxRow; r++) {
          if (poolIndex >= MAX_POOL_SIZE) break;

          const imgIdx = getMoodboardImageIndex(c, r, userImages.length);
          const cardW = BASE_COL_W;
          const cardH = getCardNaturalHeight(imgIdx);

          const pos = getCardWorldPos(c, r, userImages.length);
          const worldX = pos.worldX;
          const worldY = pos.worldY;

          // Proyección en pantalla
          const screenX = worldX - camera.x + cx - (cardW / 2);
          const screenY = worldY - camera.y + cy - (cardH / 2);

          // Descartar si cae muy fuera de la ventana
          if (screenX + cardW < -140 || screenX > winW + 140) continue;
          if (screenY + cardH < -140 || screenY > winH + 140) continue;

          const cardItem = cardPool[poolIndex];
          poolIndex++;

          cardItem.worldX = worldX;
          cardItem.worldY = worldY;

          // Dimensiones adaptadas dinámicamente al formato de la imagen (horizontal, cuadrada o vertical)
          cardItem.wrapper.style.width = `${cardW}px`;
          cardItem.wrapper.style.height = `${cardH}px`;

          // Asignar imagen
          if (cardItem.imageIndex !== imgIdx) {
            cardItem.imageIndex = imgIdx;
            cardItem.img.src = userImages[imgIdx].thumb;
          }

          // Distancia exacta de esta tarjeta al centro de la pantalla
          const cardCenterX = screenX + cardW / 2;
          const cardCenterY = screenY + cardH / 2;
          const deltaX = cardCenterX - cx;
          const deltaY = cardCenterY - cy;
          const dist = Math.hypot(deltaX, deltaY);
          const normDist = Math.min(dist / maxScreenDist, 1.25);

          // ── ESCALA DINÁMICA PROTAGÓNICA: LA IMAGEN CENTRAL ES NOTABLEMENTE MÁS GRANDE ──
          // Radio de enfoque local (~260px): solo la imagen en el centro se expande a 1.28x.
          // Las imágenes de alrededor quedan en 0.92x (visibles, proporcionadas y con gap uniforme de 32px).
          const focusRadius = 260;
          const proximity = Math.max(0, 1.0 - Math.min(dist / focusRadius, 1.0));
          const centerBoost = Math.pow(proximity, 1.4);
          const dynamicScale = STD_SCALE + centerBoost * (HERO_SCALE - STD_SCALE);

          // ── EFECTO OJO DE PEZ (FISHEYE 3D) ──
          // 1. Hundimiento suave en Z hacia los bordes
          const fisheyeZ = -Math.pow(normDist, 1.8) * MAX_SINK_Z;

          // 2. Curvatura de lente suave
          const angle = Math.atan2(deltaY, deltaX);
          const tiltFactor = Math.pow(normDist, 1.2) * MAX_TILT;
          const rotX = Math.sin(angle) * tiltFactor;
          const rotY = -Math.cos(angle) * tiltFactor;

          // 3. Cero rotación en Z (100% rectas y verticales como en la referencia)
          // rotZ = 0deg

          // 4. DESENFOQUE ÓPTICO EN BORDES (SIN OSCURIDAD / FONDO CLARO)
          if (!cardItem.hovered) {
            let blurPx = 0;
            if (normDist > 0.48) {
              blurPx = Math.pow((normDist - 0.48) / 0.52, 1.35) * 11;
            }
            cardItem.card.style.filter = blurPx > 0.4 ? `blur(${blurPx.toFixed(1)}px)` : 'none';
          }

          // Aplicar transformaciones 3D aceleradas
          cardItem.wrapper.style.display = 'block';
          cardItem.wrapper.style.transform = `translate3d(${screenX}px, ${screenY}px, ${fisheyeZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${dynamicScale})`;

          // La tarjeta en el centro tiene prioridad absoluta visual y queda al frente
          cardItem.wrapper.style.zIndex = cardItem.hovered ? 99 : Math.round(10 + centerBoost * 70);
        }
      }

      // Ocultar tarjetas libres del pool
      for (let k = poolIndex; k < MAX_POOL_SIZE; k++) {
        cardPool[k].wrapper.style.display = 'none';
      }
    }

    // ── Bucle Principal (RAF) ──
    function mainLoop() {
      updateCamera();
      renderInfiniteGallery();
      rafId = requestAnimationFrame(mainLoop);
    }

    function startLoop() {
      if (!rafId) rafId = requestAnimationFrame(mainLoop);
    }

    function stopLoop() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    // ── Lightbox Zoom-In ──
    function openLightbox(imgData) {
      lightboxActive = true;
      lightboxImg.src = imgData.fullSrc;
      lightboxGlow.src = imgData.thumb;
      lightbox.classList.add('active');
      stopLoop();
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxActive = false;
      setTimeout(() => {
        lightboxImg.style.transform = 'translate3d(0, 0, 0)';
      }, 300);
      startLoop();
    }

    lightbox.addEventListener('mousemove', (e) => {
      if (!lightboxActive) return;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;

      const rotX = dy * 12;
      const rotY = -dx * 12;
      lightboxImg.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      lightboxGlow.style.transform = `translate3d(${dx * 30}px, ${dy * 30}px, -25px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });

    lightbox.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxActive) closeLightbox();
    });

    // ── Carga de archivos por Doble Clic ──
    document.addEventListener('dblclick', (e) => {
      if (lightboxActive) return;
      if (e.target.closest('.card-wrapper')) return;
      if (e.target.closest('.lightbox-overlay')) return;
      fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      emptyState.style.display = 'none';

      try {
        const processed = await Promise.all(files.map(f => optimizeImage(f)));
        userImages.push(...processed);

        // Centrar cámara en el origen
        camera.x = 0;
        camera.y = 0;
        camera.targetX = 0;
        camera.targetY = 0;
        camera.vx = 0;
        camera.vy = 0;

        startLoop();
      } catch (err) {
        console.error('Error cargando imágenes:', err);
      }

      fileInput.value = '';
    });
  </script>
</body>

</html>
