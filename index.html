<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Infinita 3D</title>
  <meta name="description" content="Galería interactiva 3D infinita con efecto ojo de pez y mosaico continuo">
  <style>
    :root {
      --perspective: 1100px;
      --card-radius: 16px;
      --card-width: 250px;
      --card-height: 340px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #06070a;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      position: relative;
      cursor: default;
    }

    /* Fondo espacial profundo y limpio */
    .space-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #0d121d 0%, #080a10 50%, #030406 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* Halo ambiental suave en el centro */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 900px;
      height: 900px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 60, 110, 0.18) 0%, rgba(15, 25, 45, 0.08) 50%, transparent 75%);
      filter: blur(60px);
      z-index: 1;
      pointer-events: none;
      transition: background 0.8s ease;
    }

    /* Viewport de perspectiva 3D */
    #galaxy-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: var(--perspective);
      perspective-origin: 50% 50%;
      z-index: 2;
    }

    /* Tarjeta individual */
    .card-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--card-width);
      height: var(--card-height);
      will-change: transform, opacity;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: center center;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--card-radius);
      transition: transform 0.18s ease-out, box-shadow 0.22s ease-out;
      transform-style: preserve-3d;
    }

    /* Brillo trasero que NO corta ni interseca con tarjetas vecinas */
    .card-glow {
      position: absolute;
      inset: -16px;
      border-radius: calc(var(--card-radius) + 14px);
      filter: blur(24px) saturate(2.4);
      opacity: 0;
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      background: #11141c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.28);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Viñeta perimetral Ojo de Pez */
    #fisheye-vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(
        ellipse 52% 52% at 50% 50%,
        transparent 0%,
        transparent 65%,
        rgba(3, 4, 7, 0.35) 80%,
        rgba(3, 4, 7, 0.75) 92%,
        rgba(3, 4, 7, 0.96) 100%
      );
    }

    /* HUD de navegación con Ctrl */
    #ctrl-indicator {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 30;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.6px;
      padding: 10px 24px;
      background: rgba(18, 24, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(50, 120, 255, 0.2);
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #ctrl-indicator.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .ctrl-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
      animation: pulseDot 1.2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Pista inferior */
    #nav-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.38);
      font-size: 0.74rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }

    /* Estado Vacío */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      padding: 44px 56px;
      border: 2px dashed rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .empty-state:hover {
      border-color: rgba(255, 255, 255, 0.45);
      color: #fff;
      transform: translate(-50%, -52%);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6);
      background: rgba(255, 255, 255, 0.06);
    }

    .empty-state svg {
      width: 52px;
      height: 52px;
      fill: currentColor;
      margin-bottom: 16px;
      opacity: 0.85;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 0.88rem;
      opacity: 0.65;
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 7, 12, 0.55);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      perspective: 1500px;
      cursor: zoom-out;
    }

    .lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content-wrapper {
      transform: scale(0.4) translateY(60px);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      position: relative;
    }

    .lightbox-overlay.active .lightbox-content-wrapper {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .lightbox-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: blur(65px) saturate(2.4) brightness(1.25);
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
      transform: translate3d(0, 0, -25px);
    }

    .lightbox-img {
      max-width: 86vw;
      max-height: 84vh;
      border-radius: 16px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.85);
      object-fit: contain;
      position: relative;
      z-index: 1;
      transform: translate3d(0, 0, 0);
      transition: transform 0.12s ease-out;
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Input de archivos oculto -->
  <input type="file" id="file-input" accept="image/*" multiple>

  <!-- Fondo base espacial -->
  <div class="space-bg"></div>

  <!-- Halo de color ambiental suave en el centro -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Viewport 3D -->
  <div id="galaxy-viewport"></div>

  <!-- Viñeta Ojo de Pez perimetral -->
  <div id="fisheye-vignette"></div>

  <!-- HUD Ctrl activo -->
  <div id="ctrl-indicator">
    <span class="ctrl-dot"></span>
    <span>Modo Vuelo Activo — Mueve el cursor a los bordes para acelerar</span>
  </div>

  <!-- Hint de navegación inferior -->
  <div id="nav-hint" style="display: none;">Doble clic para más imágenes &nbsp;·&nbsp; Mantén presionado Ctrl para volar por la galería</div>

  <!-- Estado Inicial Vacío -->
  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <h2>Haz doble clic en la pantalla</h2>
    <p>para cargar tus imágenes y generar la galería infinita</p>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox">
    <div class="lightbox-content-wrapper" id="lightbox-wrapper">
      <img class="lightbox-glow" id="lightbox-glow" src="" alt="">
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>
  </div>

  <script>
    // ── Referencias DOM ──
    const fileInput     = document.getElementById('file-input');
    const emptyState    = document.getElementById('empty-state');
    const viewport      = document.getElementById('galaxy-viewport');
    const ambientGlow   = document.getElementById('ambient-glow');
    const lightbox      = document.getElementById('lightbox');
    const lightboxImg   = document.getElementById('lightbox-img');
    const lightboxGlow  = document.getElementById('lightbox-glow');
    const ctrlIndicator = document.getElementById('ctrl-indicator');
    const navHint       = document.getElementById('nav-hint');

    // ── Catálogo de imágenes cargadas ──
    let userImages = [];
    let rafId = null;
    let isCtrlPressed = false;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let lightboxActive = false;

    // Dimensiones de celdas de la cuadrícula infinita
    const CARD_W = 250;
    const CARD_H = 340;
    const GAP_X  = 38;
    const GAP_Y  = 38;
    const STEP_X = CARD_W + GAP_X; // 288px
    const STEP_Y = CARD_H + GAP_Y; // 378px

    // Cámara con posición e inercia
    const camera = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      vx: 0,
      vy: 0
    };

    // Parámetros de velocidad y aceleración (duplicados y potenciados)
    const BASE_SPEED = 28; // Velocidad base duplicada
    const ACCEL_POWER = 2.0; // Aceleración hacia las esquinas
    const INERTIA_FRICTION = 0.92;
    const LERP_SMOOTH = 0.09;

    // Efecto Ojo de Pez (Fisheye 3D)
    const MAX_SINK_Z = 420; // Cuánto se hunden las tarjetas en los bordes
    const MAX_TILT   = 18;  // Grados de rotación hacia el centro

    // Piscina de tarjetas DOM para renderizado de alto rendimiento
    const cardPool = [];
    const MAX_POOL_SIZE = 90;

    // Generar la piscina de elementos DOM una sola vez
    function initCardPool() {
      for (let i = 0; i < MAX_POOL_SIZE; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.style.display = 'none';

        const glow = document.createElement('div');
        glow.className = 'card-glow';

        const inner = document.createElement('div');
        inner.className = 'card-inner';

        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.className = 'card-img';
        img.draggable = false;

        card.appendChild(img);
        inner.appendChild(glow);
        inner.appendChild(card);
        wrapper.appendChild(inner);
        viewport.appendChild(wrapper);

        const cardItem = {
          wrapper,
          inner,
          card,
          glow,
          img,
          imageIndex: -1,
          hovered: false,
          hoverRotX: 0,
          hoverRotY: 0
        };

        // Eventos de hover interactivo
        wrapper.addEventListener('mousemove', (e) => {
          if (isCtrlPressed || lightboxActive) return;
          const rect = wrapper.getBoundingClientRect();
          const normX = (e.clientX - rect.left) / rect.width;
          const normY = (e.clientY - rect.top) / rect.height;

          cardItem.hoverRotX = (normY - 0.5) * 22;
          cardItem.hoverRotY = -(normX - 0.5) * 22;
          cardItem.hovered = true;

          // Encender brillo trasero vibrante
          glow.style.opacity = '1';
          glow.style.background = `radial-gradient(circle at ${normX * 100}% ${normY * 100}%, rgba(100, 180, 255, 0.7) 0%, rgba(30, 80, 180, 0.35) 45%, transparent 75%)`;
          inner.style.transform = `translateZ(50px) scale(1.08) rotateX(${cardItem.hoverRotX}deg) rotateY(${cardItem.hoverRotY}deg)`;
          inner.style.boxShadow = '0 32px 80px rgba(0, 0, 0, 0.85), 0 0 45px rgba(80, 160, 255, 0.45)';
        });

        wrapper.addEventListener('mouseleave', () => {
          cardItem.hovered = false;
          cardItem.hoverRotX = 0;
          cardItem.hoverRotY = 0;
          glow.style.opacity = '0';
          inner.style.transform = 'translateZ(0px) scale(1) rotateX(0deg) rotateY(0deg)';
          inner.style.boxShadow = '';
        });

        wrapper.addEventListener('click', (e) => {
          e.stopPropagation();
          if (cardItem.imageIndex >= 0 && userImages[cardItem.imageIndex]) {
            openLightbox(userImages[cardItem.imageIndex]);
          }
        });

        cardPool.push(cardItem);
      }
    }

    initCardPool();

    // ── Mapeo matemático determinista para duplicación infinita continua ──
    // Garantiza que imágenes vecinas nunca sean idénticas y que el mosaico sea armónico
    function getImageIndex(col, row, count) {
      if (count <= 1) return 0;
      // Staggered pattern coprime
      const k = (count % 2 === 0) ? (count - 1) : 3;
      const val = col + row * k;
      return ((val % count) + count) % count;
    }

    // ── Optimización de imágenes en cliente con Canvas ──
    function optimizeImage(file) {
      return new Promise((resolve, reject) => {
        const fullSrc = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const MAX_SIZE = 800;
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (w > MAX_SIZE || h > MAX_SIZE) {
            const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          let thumb;
          try {
            thumb = canvas.toDataURL('image/webp', 0.85);
          } catch {
            thumb = canvas.toDataURL('image/jpeg', 0.85);
          }

          resolve({
            thumb,
            fullSrc,
            w: img.naturalWidth,
            h: img.naturalHeight
          });
        };
        img.onerror = reject;
        img.src = fullSrc;
      });
    }

    // ── Teclado y Control de Vuelo ──
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Control') {
        isCtrlPressed = true;
        ctrlIndicator.classList.add('visible');
        document.body.style.cursor = 'crosshair';
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Control') {
        isCtrlPressed = false;
        ctrlIndicator.classList.remove('visible');
        document.body.style.cursor = 'default';

        // Conservar inercia al soltar
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const ndx = (mouseX - cx) / cx;
        const ndy = (mouseY - cy) / cy;
        const dist = Math.hypot(ndx, ndy);
        const speed = BASE_SPEED * Math.pow(dist, ACCEL_POWER);

        camera.vx = ndx * speed * 0.45;
        camera.vy = ndy * speed * 0.45;
      }
    });

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // ── Actualización de Cámara con Alta Aceleración ──
    function updateCamera() {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      if (isCtrlPressed) {
        // Vector normalizado desde el centro [-1, 1]
        const ndx = (mouseX - cx) / cx;
        const ndy = (mouseY - cy) / cy;
        const dist = Math.min(Math.hypot(ndx, ndy), 1.5);

        // Aceleración no lineal: en las esquinas se dispara la velocidad
        const speed = BASE_SPEED * (1 + Math.pow(dist, ACCEL_POWER) * 2.2);

        camera.targetX += ndx * speed;
        camera.targetY += ndy * speed;
        camera.vx = ndx * speed;
        camera.vy = ndy * speed;
      } else {
        // Inercia suave y desaceleración
        camera.vx *= INERTIA_FRICTION;
        camera.vy *= INERTIA_FRICTION;
        if (Math.abs(camera.vx) < 0.05) camera.vx = 0;
        if (Math.abs(camera.vy) < 0.05) camera.vy = 0;

        camera.targetX += camera.vx;
        camera.targetY += camera.vy;
      }

      // Suavizado lerp
      camera.x += (camera.targetX - camera.x) * LERP_SMOOTH;
      camera.y += (camera.targetY - camera.y) * LERP_SMOOTH;
    }

    // ── Renderizado Infinito (Virtual Tiling + Fisheye 3D) ──
    function renderInfiniteGallery() {
      if (userImages.length === 0) return;

      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const cx = winW / 2;
      const cy = winH / 2;
      const maxScreenDist = Math.hypot(cx, cy);

      // Calcular rango de columnas y filas visibles alrededor de la cámara
      const margin = 280;
      const minScreenX = -margin;
      const maxScreenX = winW + margin;
      const minScreenY = -margin;
      const maxScreenY = winH + margin;

      const minRow = Math.floor((camera.y + minScreenY - cy) / STEP_Y) - 1;
      const maxRow = Math.ceil((camera.y + maxScreenY - cy) / STEP_Y) + 1;

      let poolIndex = 0;

      for (let r = minRow; r <= maxRow; r++) {
        // Desplazamiento alternado por fila (staggered masonry) para que nunca se vea rígido
        const rowOffsetX = (Math.abs(r) % 2 !== 0) ? (STEP_X * 0.5) : 0;
        const worldY = r * STEP_Y;
        const screenY = worldY - camera.y + cy - (CARD_H / 2);

        const minCol = Math.floor((camera.x + minScreenX - cx - rowOffsetX) / STEP_X) - 1;
        const maxCol = Math.ceil((camera.x + maxScreenX - cx - rowOffsetX) / STEP_X) + 1;

        for (let c = minCol; c <= maxCol; c++) {
          if (poolIndex >= MAX_POOL_SIZE) break;

          const worldX = c * STEP_X + rowOffsetX;
          const screenX = worldX - camera.x + cx - (CARD_W / 2);

          // Verificar si cae dentro del área visible + buffer
          if (screenX + CARD_W < minScreenX || screenX > maxScreenX) continue;
          if (screenY + CARD_H < minScreenY || screenY > maxScreenY) continue;

          // Tarjeta disponible en el pool
          const cardItem = cardPool[poolIndex];
          poolIndex++;

          // Determinar qué imagen le corresponde en el patrón infinito
          const imgIdx = getImageIndex(c, r, userImages.length);
          if (cardItem.imageIndex !== imgIdx) {
            cardItem.imageIndex = imgIdx;
            cardItem.img.src = userImages[imgIdx].thumb;
          }

          // Distancia de la tarjeta al centro de la pantalla
          const cardCenterX = screenX + CARD_W / 2;
          const cardCenterY = screenY + CARD_H / 2;
          const deltaX = cardCenterX - cx;
          const deltaY = cardCenterY - cy;
          const dist = Math.hypot(deltaX, deltaY);
          const normDist = Math.min(dist / maxScreenDist, 1.2);

          // ── EFECTO OJO DE PEZ (FISHEYE 3D) ──
          // 1. Hundimiento cuadrático en Z hacia las esquinas
          const fisheyeZ = -Math.pow(normDist, 1.8) * MAX_SINK_Z;

          // 2. Curvatura esférica: rotar hacia el centro
          const angle = Math.atan2(deltaY, deltaX);
          const tiltFactor = Math.pow(normDist, 1.2) * MAX_TILT;
          const rotX = Math.sin(angle) * tiltFactor;
          const rotY = -Math.cos(angle) * tiltFactor;

          // 3. Escala y opacidad suave en los extremos
          const scale = Math.max(1.0 - normDist * 0.16, 0.75);
          const opacity = Math.max(1.0 - Math.pow(normDist, 2.8) * 0.65, 0.15);

          // Aplicar transformaciones 3D aceleradas por GPU
          cardItem.wrapper.style.display = 'block';
          cardItem.wrapper.style.transform = `translate3d(${screenX}px, ${screenY}px, ${fisheyeZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${scale})`;
          cardItem.wrapper.style.opacity = opacity;

          // Las tarjetas más cercanas al centro tienen mayor prioridad visual
          cardItem.wrapper.style.zIndex = cardItem.hovered ? 99 : Math.round((1.2 - normDist) * 30);
        }
      }

      // Ocultar tarjetas no usadas del pool
      for (let i = poolIndex; i < MAX_POOL_SIZE; i++) {
        cardPool[i].wrapper.style.display = 'none';
      }
    }

    // ── Bucle Principal (RAF) ──
    function mainLoop() {
      updateCamera();
      renderInfiniteGallery();
      rafId = requestAnimationFrame(mainLoop);
    }

    function startLoop() {
      if (!rafId) rafId = requestAnimationFrame(mainLoop);
    }

    function stopLoop() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    // ── Lightbox Zoom-In ──
    function openLightbox(imgData) {
      lightboxActive = true;
      lightboxImg.src = imgData.fullSrc;
      lightboxGlow.src = imgData.thumb;
      lightbox.classList.add('active');
      stopLoop();
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxActive = false;
      setTimeout(() => {
        lightboxImg.style.transform = 'translate3d(0, 0, 0)';
      }, 300);
      startLoop();
    }

    lightbox.addEventListener('mousemove', (e) => {
      if (!lightboxActive) return;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;

      const rotX = dy * 12;
      const rotY = -dx * 12;
      lightboxImg.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      lightboxGlow.style.transform = `translate3d(${dx * 30}px, ${dy * 30}px, -25px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });

    lightbox.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxActive) closeLightbox();
    });

    // ── Carga de archivos por Doble Clic ──
    document.addEventListener('dblclick', (e) => {
      if (lightboxActive) return;
      if (e.target.closest('.card-wrapper')) return;
      if (e.target.closest('.lightbox-overlay')) return;
      fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      emptyState.style.display = 'none';
      navHint.style.display = 'block';

      try {
        const processed = await Promise.all(files.map(f => optimizeImage(f)));
        userImages.push(...processed);

        // Centrar cámara en el origen
        camera.x = 0;
        camera.y = 0;
        camera.targetX = 0;
        camera.targetY = 0;
        camera.vx = 0;
        camera.vy = 0;

        startLoop();
      } catch (err) {
        console.error('Error cargando imágenes:', err);
      }

      fileInput.value = '';
    });
  </script>
</body>
</html>
